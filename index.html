<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Neo by Neoeffex — inteligência, acessibilidade e futuro.">
  <meta name="theme-color" content="#141414">
  <meta name="application-version" content="0.1.10">
  <meta property="og:title" content="Neo by Neoeffex">
  <meta property="og:description" content="Neo by Neoeffex">
  <title>Neo by Neoeffex</title>

  <link rel="icon" type="image/png" href="img/LogoNeoeffexsemtexto.png?v=0.1.10">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&family=Josefin+Sans:wght@400;500;600&family=Michroma&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css?v=0.1.10">
  <link rel="stylesheet" href="landing.css?v=0.1.10">
  <link rel="stylesheet" href="atmosphere.css?v=0.1.10">
  <link rel="stylesheet" href="interaction.css?v=0.1.10">
  <script src="landing.js?v=0.1.10" defer></script>
</head>

<body>
  <main class="hero" id="inicio">
    <div class="hero__background" aria-hidden="true">
      <div class="hero__ambient hero__ambient--left"></div>
      <div class="hero__ambient hero__ambient--right"></div>
      <div class="hero__vignette"></div>
    </div>

    <div class="hero__atmosphere" aria-hidden="true">
      <div class="smoke-cloud smoke-cloud--one"></div>
      <div class="smoke-cloud smoke-cloud--two"></div>
      <div class="smoke-cloud smoke-cloud--three"></div>
      <div class="smoke-cloud smoke-cloud--four"></div>
    </div>

    <div class="hero__interaction-field" aria-hidden="true"></div>

    <div class="hero__grain" aria-hidden="true"></div>

    <div class="hero__values" aria-label="Valores da Neo by Neoeffex">
      <span class="hero__value hero__value--intelligence">Inteligência</span>
      <span class="hero__value hero__value--accessibility">Acessibilidade</span>
      <span class="hero__value hero__value--future">Futuro</span>
      <span class="hero__value hero__value--autonomy">Autonomia</span>
      <span class="hero__value hero__value--simplicity">Simplicidade</span>
      <span class="hero__value hero__value--context">Contexto</span>
    </div>

    <section class="hero__content" aria-labelledby="hero-title">
      <p class="hero__eyebrow">Inteligência em movimento</p>

      <h1 class="hero__title" id="hero-title">
        <span class="hero__title-main">Neo</span>
        <span class="hero__title-signature">by Neoeffex</span>
      </h1>

      <p class="hero__version" aria-label="Versão da landing page">v0.1.10</p>
    </section>

    <div class="hero__edge hero__edge--top" aria-hidden="true"></div>
    <div class="hero__edge hero__edge--bottom" aria-hidden="true"></div>
  </main>
</body>
</html>
