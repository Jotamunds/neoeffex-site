<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Redefinição de senha do painel administrativo Neoeffex.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f7f9fc">
    <title>Redefinir senha | Neoeffex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="is-reset-page">
    <main class="auth-screen" aria-labelledby="resetTitle">
        <div class="auth-panel">
            <a class="brand" href="index.html" aria-label="Voltar para o login">
                <span class="brand__mark" aria-hidden="true"></span>
                <span>neoeffex</span>
            </a>
            <div class="auth-copy">
                <span class="eyebrow">CATALOG_SYSTEM / SEGURANÇA</span>
                <h1 id="resetTitle">Crie uma nova senha.</h1>
                <p>Use uma senha forte e diferente das usadas em outros serviços.</p>
            </div>
            <form class="auth-form" id="resetForm" novalidate>
                <label for="newPassword">Nova senha</label>
                <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="12" required>
                <label for="newPasswordConfirmation">Confirmar nova senha</label>
                <input id="newPasswordConfirmation" name="newPasswordConfirmation" type="password" autocomplete="new-password" minlength="12" required>
                <button class="primary-button" id="resetSubmit" type="submit">Atualizar senha</button>
                <p class="auth-feedback" id="resetFeedback" role="status" aria-live="polite"></p>
            </form>
            <a class="text-link" href="index.html">Voltar para o login</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js" defer></script>
    <script src="config.js" defer></script>
    <script src="assets/js/reset-password.js" defer></script>
</body>
</html>
